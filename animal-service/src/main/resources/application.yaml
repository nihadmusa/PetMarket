spring:
  application:
    name: animal-service

  datasource:
    username: admin
    password: 12345
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/petmarket-db

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  upload-dir: ./uploads

server:
  port: 8082

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

